version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: red-team-engine:latest
    container_name: red_team_engine
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      # Persist generated reports and SQLite run history outside the container
      - ./reports:/app/reports
    # Allows the container to reach Ollama running on the host machine via
    # http://host.docker.internal:11434/v1 on both Windows/Mac AND Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
